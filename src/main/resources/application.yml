spring:
  application:
    name: osg
  main:
    allow-bean-definition-overriding: true
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
  mvc:
    static-path-pattern: /**
  devtools:
    restart:
      enabled: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MySQLURL}
    username: ${MySQLUSER}
    password: ${MySQLPWD}
    hikari:
      max-lifetime: 60000
      idle-timeout: 60000
      keepalive-time: 10000
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_URL}
      port: ${REDIS_PORT}
      password: ${REDIS_PWD}
      database: 0     # 使用第几个数据库（0-15）
      lettuce:
        pool:
          max-active: 8   # 连接池最大活跃连接数
          max-idle: 8     # 最大空闲连接
          min-idle: 0     # 最小空闲连接
          max-wait: 100ms # 连接等待超时时间

  ai:
    # 使用通用的 OpenAI 接口配置，指向 DeepSeek/Aliyun/其他厂商
    # 硅基流动 https://api.siliconflow.cn/ SILICONFLOW_API_KEY
    # DeepSeek https://api.deepseek.com DEEPSEEK_API_KEY
    # OFoxAI https://api.ofox.ai/ OFOX_API_KEY
    # KIMI https://api.moonshot.cn/ KIMI_API_KEY
    # 百炼 https://dashscope.aliyuncs.com/compatible-mode/v1 BAILIAN_API_KEY
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-opus-4-7
          temperature: 0.1
          top_p: 0.7
          max_tokens: 350000
    openai:
      base-url: https://api.siliconflow.cn/
      api-key: ${SILICONFLOW_API_KEY}
      chat:
        options:
          model: ${custom.qwen-name}
          temperature: 0.1
          top_p: 0.7
#          stop:
#            - "\n"
          frequency_penalty: 0.2
          presence_penalty: 0.1
          max_tokens: 8000
          max-completion-tokens: 2000000
      embedding:
        base-url: https://api.siliconflow.cn/
        api-key:  ${SILICONFLOW_API_KEY}
        options:
          model: ${custom.embedding-name}
          dimensions: 4096
    vectorstore:
      qdrant:
        host: ${QDRANT_URL}
        port: ${QDRANT_PORT}
        api-key: ${QDRANT_API_KEY}
        collection-name: ${QDRANT_COLLECTION_NAME}
        use-tls: true
        initialize-schema: true
#      pgvector:
#        dimensions: 4096
#        distance-type: COSINE_DISTANCE
#        index-type: HNSW
#        initialize-schema: false
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
            platform: mysql

custom:
  code:
    url: https://dashscope.aliyuncs.com/compatible-mode/v1
    apiKey: ${BAILIAN_API_KEY}
    name:  qwen3.5-397b-a17b #anthropic/claude-opus-4.6 Pro/deepseek-ai/DeepSeek-V3.2 deepseek-v4-flash qwen3-coder-plus
    tokens: 2000000
    stop:
      - "```"
      - "```json"
    param:
      temperature: 0.1
      top_p: 0.7
      frequency_penalty: 0.2
      presence_penalty: 0.1
      max_tokens: 60000
      max-completion-tokens: 2000000
  chat:
    url: https://dashscope.aliyuncs.com/compatible-mode/v1
    apiKey: ${BAILIAN_API_KEY}
    name:  qwen3.6-max-preview
    tokens: 50000
    stop:
      - "```"
      - "```json"
    param:
      temperature: 0.1
      top_p: 0.7
      frequency_penalty: 0.2
      presence_penalty: 0.1
      max_tokens: 60000
      max-completion-tokens: 2000000

  embedding-name: Qwen/Qwen3-Embedding-8B
  rerank-name: Qwen/Qwen3-Reranker-8B
  vl-name: deepseek-ai/DeepSeek-OCR
  maxMessage: 1
  maxToken: 500
  chunkSize: 200

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: INFO
    org.springframework.ai.transformer.splitter: WARN