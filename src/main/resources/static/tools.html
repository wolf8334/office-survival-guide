<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能问答</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <style>
        body { margin: 0; background: #f5f4f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; color: #1a1a1a; }
        .shell { max-width: 1400px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .header {
            display: flex; align-items: center; gap: 16px;
            padding: 18px 22px; background: #fff; border: 1px solid #e8e6e0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04); border-radius: 12px; flex-shrink: 0;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-badge {
            width: 44px; height: 44px; border: 1px solid #d0d5dd; background: #f5f4f0;
            display: grid; place-items: center; font-weight: 700; color: #4aa3ff; letter-spacing: 1px; border-radius: 8px;
        }
        .brand h1 { margin: 0; font-size: 18px; font-weight: 600; color: #1a1a1a; }
        .brand p { margin: 4px 0 0; color: #888; font-size: 12px; }

        .chat-panel {
            flex: 1; min-height: 0; background: #fff; border: 1px solid #e8e6e0;
            border-radius: 12px; margin-top: 20px; display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-head {
            padding: 16px 18px; border-bottom: 1px solid #e8e6e0;
            background: linear-gradient(90deg, rgba(74, 163, 255, 0.06), transparent);
            font-weight: 600; font-size: 13px; border-radius: 12px 12px 0 0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-body { flex: 1; overflow-y: auto; padding: 24px; }
        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }

        .msg-row { display: flex; margin-bottom: 24px; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.assistant { justify-content: flex-start; }

        .avatar {
            width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
            font-size: 14px; font-weight: 700; flex-shrink: 0;
        }
        .msg-row.assistant .avatar { background: #eef6ff; color: #4aa3ff; border: 1px solid #d4e4f7; margin-right: 10px; }
        .msg-row.user .avatar { background: #4aa3ff; color: #fff; margin-left: 10px; order: 1; }

        .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.75; word-break: break-word; }
        .msg-row.user .bubble { background: #4aa3ff; color: #fff; border-top-right-radius: 4px; }
        .msg-row.assistant .bubble { background: #f9f9f8; color: #1a1a1a; border: 1px solid #e8e6e0; border-top-left-radius: 4px; }

        .bubble .markdown h1, .bubble .markdown h2, .bubble .markdown h3, .bubble .markdown h4 {
            margin-top: 1em; margin-bottom: 0.5em; color: #1a1a1a; line-height: 1.35;
        }
        .bubble .markdown h1 { font-size: 22px; border-bottom: 1px solid #e8e6e0; padding-bottom: 8px; }
        .bubble .markdown h2 { font-size: 18px; }
        .bubble .markdown h3 { font-size: 15px; }
        .bubble .markdown p { margin: 0 0 0.8em; }
        .bubble .markdown p:last-child { margin-bottom: 0; }
        .bubble .markdown ul, .bubble .markdown ol { padding-left: 22px; margin: 0 0 0.8em; }
        .bubble .markdown li { margin: 0.3em 0; }
        .bubble .markdown blockquote { margin: 0.8em 0; padding: 8px 12px; border-left: 4px solid #4aa3ff; background: #f0f7ff; color: #555; border-radius: 0 8px 8px 0; }
        .bubble .markdown code { background: #f0eee8; padding: 2px 5px; font-family: Consolas, Monaco, monospace; font-size: 0.92em; border-radius: 4px; color: #c04a00; }
        .bubble .markdown pre { background: #1a1a1a; border: 1px solid #333; padding: 14px; overflow: auto; margin: 0.8em 0; border-radius: 8px; }
        .bubble .markdown pre code { background: transparent; border: none; padding: 0; display: block; white-space: pre; color: #e0e0e0; }
        .bubble .markdown table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 13px; }
        .bubble .markdown th, .bubble .markdown td { border: 1px solid #e0ddd8; padding: 8px 10px; text-align: left; vertical-align: top; }
        .bubble .markdown th { background: #f5f4f0; }
        .bubble .markdown a { color: #4aa3ff; text-decoration: none; }
        .bubble .markdown hr { border: none; border-top: 1px solid #e0ddd8; margin: 16px 0; }

        .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
        .typing-indicator span {
            width: 7px; height: 7px; background: #aaa; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .chat-footer {
            padding: 16px 18px; border-top: 1px solid #e8e6e0; background: #faf9f7;
            display: flex; gap: 12px; align-items: flex-end; flex-shrink: 0;
        }
        .chat-footer .el-textarea__inner { border-radius: 8px !important; resize: none; }

        .empty-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #bbb; }
        .empty-hint .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-hint p { font-size: 14px; margin: 0; }

        @media (max-width: 640px) {
            .shell { padding: 12px; }
            .bubble { max-width: 85%; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="shell">
        <div class="header">
            <el-button text @click="goHome" style="font-size: 12px; color: #888;">← 返回首页</el-button>
            <div class="brand">
                <div class="brand-badge">QA</div>
                <div>
                    <h1>智能问答</h1>
                    <p>输入问题，获取智能解答</p>
                </div>
            </div>
        </div>

        <div class="chat-panel">
            <div class="chat-head">
                <span>对话记录</span>
                <el-button text type="info" size="small" @click="clearMessages" :disabled="loading || messages.length === 0">清空记录</el-button>
            </div>

            <div class="chat-body" ref="chatBodyRef">
                <div v-if="messages.length === 0" class="empty-hint">
                    <div class="icon">💬</div>
                    <p>请输入你的问题，开始对话吧</p>
                </div>

                <template v-for="(msg, idx) in messages" :key="idx">
                    <div class="msg-row user" v-if="msg.role === 'user'">
                        <div class="bubble">{{ msg.content }}</div>
                        <div class="avatar">我</div>
                    </div>
                    <div class="msg-row assistant" v-else>
                        <div class="avatar">AI</div>
                        <div class="bubble markdown" v-html="renderMd(msg.content)"></div>
                    </div>
                </template>

                <div class="msg-row assistant" v-if="loading">
                    <div class="avatar">AI</div>
                    <div class="bubble">
                        <div class="typing-indicator"><span></span><span></span><span></span></div>
                    </div>
                </div>
            </div>

            <div class="chat-footer">
                <el-input
                    v-model="inputText"
                    type="textarea"
                    :autosize="{ minRows: 1, maxRows: 5 }"
                    placeholder="输入你的问题..."
                    :disabled="loading"
                    @keydown.enter.exact.prevent="sendMessage"
                />
                <el-button type="primary" @click="sendMessage" :loading="loading" style="height: 40px;" round>发送</el-button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
    const { createApp, ref, nextTick } = Vue;
    createApp({
        setup() {
            const inputText = ref('');
            const messages = ref([]);
            const loading = ref(false);
            const chatBodyRef = ref(null);

            marked.setOptions({ breaks: true, gfm: true });

            function goHome() { window.location.href = '/index.html'; }

            function renderMd(text) {
                if (!text) return '';
                const html = marked.parse(text);
                return DOMPurify.sanitize(html);
            }

            function scrollToBottom() {
                nextTick(() => {
                    if (chatBodyRef.value) chatBodyRef.value.scrollTop = chatBodyRef.value.scrollHeight;
                });
            }

            function clearMessages() {
                messages.value = [];
            }

            async function sendMessage() {
                const prompt = inputText.value.trim();
                if (!prompt || loading.value) return;

                messages.value.push({ role: 'user', content: prompt });
                inputText.value = '';
                loading.value = true;
                scrollToBottom();

                try {
                    const url = `hqdmx/tools?prompt=${encodeURIComponent(prompt)}`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);
                    const text = await response.text();
                    messages.value.push({ role: 'assistant', content: text });
                } catch (error) {
                    messages.value.push({ role: 'assistant', content: `**请求失败**\n\n${error.message}` });
                } finally {
                    loading.value = false;
                    scrollToBottom();
                }
            }

            return { inputText, messages, loading, chatBodyRef, goHome, renderMd, sendMessage, clearMessages };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
