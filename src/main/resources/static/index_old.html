<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工具平台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f4f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 48px;
            background: #fff;
            border-bottom: 1px solid #e8e6e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
        }
        .topbar-title { font-size: 14px; font-weight: 500; color: #1a1a1a; }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .container { width: 100%; max-width: 680px; }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }
        .hero p {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
            line-height: 1.6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #e8e6e0;
            border-radius: 12px;
            padding: 24px 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
            cursor: pointer;
        }
        .card:hover {
            border-color: #bbb;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .icon-green { background: #e8f5e9; }
        .icon-blue  { background: #e3f2fd; }
        .icon-amber { background: #fff8e1; }

        .card-name {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .card-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.55;
        }

        .card-arrow {
            margin-top: auto;
            font-size: 11px;
            color: #bbb;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card:hover .card-arrow { color: #888; }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2ecc71;
            margin-right: 5px;
            vertical-align: middle;
        }

        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <span class="topbar-title">AI 工具平台</span>
</div>

<div class="main">
    <div class="container">
        <div class="hero">
            <h1>选择一个工具开始</h1>
            <p>基于大语言模型的开发辅助工具集</p>
        </div>

        <div class="cards">
            <a class="card" href="chat_old.html">
                <div class="card-icon icon-blue">🔍</div>
                <div class="card-name">RAG 增强搜索</div>
                <div class="card-desc">基于知识库的语义检索与问答，获取更精准的上下文回答。</div>
                <div class="card-arrow"><span class="status-dot"></span>进入</div>
            </a>

            <a class="card" href="code_old.html">
                <div class="card-icon icon-green">⚡</div>
                <div class="card-name">代码智能生成</div>
                <div class="card-desc">描述需求并上传参考文件，自动生成完整的业务代码模块。</div>
                <div class="card-arrow"><span class="status-dot"></span>进入</div>
            </a>

            <a class="card" href="upload.html">
                <div class="card-icon icon-amber">📚</div>
                <div class="card-name">知识库新增</div>
                <div class="card-desc">上传文档文件，解析入库后即可在 RAG 搜索中检索使用。</div>
                <div class="card-arrow"><span class="status-dot"></span>进入</div>
            </a>
        </div>
    </div>
</div>

</body>
</html>
